<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Mart - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <script src="https://kit.fontawesome.com/9bd679d76f.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <main>

  <section class="auth-section">

    <div class="container">

      <div class="auth-wrapper">

        <div class="auth-card">

          <div class="auth-heading">
            <p class="auth-small">WELCOME BACK</p>
            <h2>Login to Mini Mart</h2>
            <p>
              Enter your details to continue shopping.
            </p>
          </div>


          <form id="loginForm">

            <div class="form-group">
              <label for="loginEmail">Email Address</label>

              <div class="input-box">
                <i class="fa-regular fa-envelope"></i>

                <input
                  type="email"
                  id="loginEmail"
                  placeholder="Enter your email"
                >
              </div>

              <small class="error-message" id="loginEmailError"></small>
            </div>


            <div class="form-group">
              <label for="loginPassword">Password</label>

              <div class="input-box">
                <i class="fa-solid fa-lock"></i>

                <input
                  type="password"
                  id="loginPassword"
                  placeholder="Enter your password"
                >

                <button
                  type="button"
                  class="password-toggle"
                  id="loginPasswordToggle"
                >
                  <i class="fa-regular fa-eye"></i>
                </button>
              </div>

              <small class="error-message" id="loginPasswordError"></small>
            </div>



            <button type="submit" class="auth-btn">
              Login
            </button>


            <p class="auth-switch">
              Don't have an account?
              <a href="register.html">Create Account</a>
            </p>

          </form>

        </div>

      </div>

    </div>

  </section>

</main>

<script src="script.js"></script>
</body>
</html>
