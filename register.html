<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Mart - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <script src="https://kit.fontawesome.com/9bd679d76f.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<main>

  <section class="auth-section">

    <div class="container">

      <div class="auth-wrapper">

        <div class="auth-card register-card">

          <div class="auth-heading">
            <p class="auth-small">JOIN MINI MART</p>
            <h2>Create Your Account</h2>
            <p>
              Register to save favorites, manage your cart and checkout faster.
            </p>
          </div>


          <form id="registerForm">

            <div class="row g-3">

              <div class="col-md-6">

                <div class="form-group">
                  <label for="firstName">First Name</label>

                  <div class="input-box">
                    <i class="fa-regular fa-user"></i>

                    <input
                      type="text"
                      id="firstName"
                      placeholder="First name"
                    >
                  </div>

                  <small class="error-message" id="firstNameError"></small>
                </div>

              </div>


              <div class="col-md-6">

                <div class="form-group">
                  <label for="lastName">Last Name</label>

                  <div class="input-box">
                    <i class="fa-regular fa-user"></i>

                    <input
                      type="text"
                      id="lastName"
                      placeholder="Last name"
                    >
                  </div>

                  <small class="error-message" id="lastNameError"></small>
                </div>

              </div>

            </div>


            <div class="form-group">

              <label for="registerEmail">
                Email Address
              </label>

              <div class="input-box">
                <i class="fa-regular fa-envelope"></i>

                <input
                  type="email"
                  id="registerEmail"
                  placeholder="Enter your email"
                >
              </div>

              <small class="error-message" id="registerEmailError"></small>

            </div>


            <div class="form-group">

              <label for="phone">
                Phone Number
              </label>

              <div class="input-box">
                <i class="fa-solid fa-phone"></i>

                <input
                  type="tel"
                  id="phone"
                  placeholder="Enter your phone number"
                >
              </div>

              <small class="error-message" id="phoneError"></small>

            </div>


            <div class="form-group">

              <label for="registerPassword">
                Password
              </label>

              <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                  type="password"
                  id="registerPassword"
                  placeholder="Create password"
                >

                <button
                  type="button"
                  class="password-toggle"
                  id="registerPasswordToggle"
                >
                  <i class="fa-regular fa-eye"></i>
                </button>

              </div>

              <small class="password-info">
                Use at least 8 characters.
              </small>

              <small class="error-message" id="registerPasswordError"></small>

            </div>


            <div class="form-group">

              <label for="confirmPassword">
                Confirm Password
              </label>

              <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                  type="password"
                  id="confirmPassword"
                  placeholder="Confirm your password"
                >

                <button
                  type="button"
                  class="password-toggle"
                  id="confirmPasswordToggle"
                >
                  <i class="fa-regular fa-eye"></i>
                </button>

              </div>

              <small class="error-message" id="confirmPasswordError"></small>

            </div>

            <button type="submit" class="auth-btn">
              Create Account
            </button>


            <p class="auth-switch">
              Already have an account?
              <a href="login.html">Login</a>
            </p>

          </form>

        </div>

      </div>

    </div>

  </section>

</main>

<script src="script.js"></script>
</body>
</html>
